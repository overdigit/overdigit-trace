[package]
name = "overdigit-trace-rs"
authors = ["OVERDIGIT <info@overdigit.com>"]
description = "daemon for the CODESYS library TraceSOCK from OVERDIGIT"
version = "0.1.3"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
inotify = "0.11.5"
time = { version = "0.3.55", features = ["formatting", "macros"] }

[features]
placeholders = []

[package.metadata.deb]
name = "overdigit-trace"
revision = "1"
maintainer-scripts = "debian/"
section = "misc"
systemd-units = { }
extended-description = """\
A daemon to collect traced data from CODESYS applications, or anywhere or anything else.\
Meant for use on OVERDIGIT WP360 PLC devices via the OVERDIGIT TraceSOCK CODESYS library."""
assets = [
    ["target/release/server", "usr/libexec/overdigit-trace/overdigit-trace", "755"],
    ["target/release/client", "usr/bin/overdigit-trace", "755"],
    ["dist/overdigit-trace", "usr/libexec/overdigit-trace/overdigit-trace-script", "755"],
]
